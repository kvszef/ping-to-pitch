# Was die Anwendung laedt: erreichbar unter /mcp/call_copilot, ausschliesslich lesend.
kind: toolset
name: call_copilot
tools:
  - find_client_by_phone
  - search_clients_by_name
  - get_client_overview
  - get_portfolio_summary
  - get_positions_top
  - get_saa_gap
  - get_open_proposals
  - get_violations
  - get_recent_notes

---
# Getrennt davon, damit Werkzeuge ausserhalb des Gespraechs nie im Kontext des Modells landen.
# Ein sqlite-execute-sql mit freiem SQL steht bewusst nicht darin: die SQLite-Quelle kennt keinen
# readOnly-Schalter, ein solches Werkzeug waere also ein Schreibrecht auf die Kundendatenbank,
# und ueber /api/tool/{name}/invoke auch ohne Toolset erreichbar.
kind: toolset
name: dev
tools:
  - dev_list_tables
  - dev_violation_details
---
# Das einzige schreibende Werkzeug. Es haengt nur an, es ueberschreibt nie: der Freitext
# eines Kunden ist ein Gedaechtnis, und ein Gespraech darf das vorige nicht loeschen.
# Bewusst in einem eigenen Toolset, damit das lesende Toolset call_copilot rein lesend bleibt.
kind: tool
name: append_call_summary
type: sqlite-sql
source: unrisk-db
description: |
  Haengt die Zusammenfassung eines Telefongespraechs an den Freitext eines Kunden an, mit
  Datum davor. Wird einmal am Ende eines Anrufs aufgerufen. Bestehender Text bleibt erhalten.
annotations:
  readOnlyHint: false
  destructiveHint: false
  idempotentHint: false
# Die Reihenfolge hier ist bindend: SQLite bindet die Fragezeichen in der Reihenfolge,
# in der die Parameter stehen. Deshalb datum, zusammenfassung, client_ref -- genau so,
# wie sie unten im Statement vorkommen.
parameters:
  - name: datum
    type: string
    description: Datum des Gespraechs als JJJJ-MM-TT.
  - name: zusammenfassung
    type: string
    description: Zwei bis vier Saetze zum Gespraech, in Schweizer Schreibweise.
  - name: client_ref
    type: string
    description: Kundenkennung, zum Beispiel TESTER-01.
statement: |
  UPDATE clients
     SET description = TRIM(
           COALESCE(description || char(10) || char(10), '')
           || 'Telefon ' || ? || ': ' || ?)
   WHERE client_ref = ?;
---
kind: toolset
name: write
tools:
  - append_call_summary
---
# Was app/ laedt: die Rohdaten, ausschliesslich lesend. Getrennt von call_copilot, weil diese
# Werkzeuge nie in den Kontext des Sprachmodells gehoeren - sie liefern ganze Lieferungen und
# app_accounts traegt Kontonamen und IBANs.
kind: toolset
name: app_data
tools:
  - app_clients
  - app_portfolios
  - app_positions
  - app_accounts
  - app_proposals
  - app_transactions
  - app_violations
  - app_notes
  - app_reference
