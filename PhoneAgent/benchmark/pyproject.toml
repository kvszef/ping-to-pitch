[project]
name = "phoneagent-stt-benchmark"
version = "0.1.0"
description = "Compare local speech-to-text models on a recorded advisory-call script"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1",
    "vosk>=0.3.45",
    "sherpa-onnx>=1.12",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "numpy",
    "jiwer>=3.0",
    "num2words>=0.5",
    "huggingface-hub",
    "requests",
    "tqdm",
    "tabulate",
]

[tool.uv]
package = false
